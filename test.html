<!DOCTYPE html>
<html>

<head>
    <title>SHL Agent Chat</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 10px;
            height: 500px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }

        .user {
            color: blue;
        }

        .assistant {
            color: green;
        }

        .rec {
            font-size: 0.9em;
            color: #555;
        }

        input[type="text"] {
            width: 80%;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
        }
    </style>
</head>

<body>
    <h2>SHL Assessment Agent</h2>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">Send</button>
    <button onclick="resetChat()">Reset</button>

    <script>
        let messages = [];
        async function send() {
            const input = document.getElementById('input');
            const content = input.value.trim();
            if (!content) return;
            addMessage('user', content);
            messages.push({ role: 'user', content });
            input.value = '';

            const resp = await fetch('https://shl-exam.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages })
            });
            const data = await resp.json();
            addMessage('assistant', data.reply);
            if (data.recommendations && data.recommendations.length > 0) {
                let recHtml = '<ul>';
                data.recommendations.forEach(r => {
                    recHtml += `<li><a href="${r.url}" target="_blank">${r.name}</a> (${r.test_type})</li>`;
                });
                recHtml += '</ul>';
                document.getElementById('chat').innerHTML += '<div class="rec">' + recHtml + '</div>';
            }
            messages.push({ role: 'assistant', content: data.reply });
        }
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = role;
            div.textContent = text;
            document.getElementById('chat').appendChild(div);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
        function resetChat() {
            messages = [];
            document.getElementById('chat').innerHTML = '';
        }
    </script>
</body>

</html>
